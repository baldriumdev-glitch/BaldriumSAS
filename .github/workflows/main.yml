name: Deploy Backends
on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Subir código a AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/BaldriumSAS"

      - name: Instalar dependencias y reiniciar PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/BaldriumSAS/logica
            npm install
            pm2 restart backend-1 || pm2 start server.js --name "backend-logica"
            cd /home/ubuntu/BaldriumSAS/persistencia
            npm install
            pm2 restart backend-2 || pm2 start index.js --name "backend-persistencia"
            pm2 save
