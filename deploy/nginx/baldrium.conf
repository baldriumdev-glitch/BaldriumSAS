# ─────────────────────────────────────────────────────────────────────────────
# BaldriumSAS - nginx
#
#   Navegador ──► nginx :80/:443
#                   ├── /       → Frontend Angular (archivos estáticos)
#                   └── /api/   → logica      (Node, 127.0.0.1:3000)
#                                   └──► persistencia (Node, 127.0.0.1:3001)  ← NO se expone
#
# Reemplaza "tudominio.com" por tu dominio real.
# Ubicación en el servidor: /etc/nginx/sites-available/baldrium.conf
# ─────────────────────────────────────────────────────────────────────────────

upstream baldrium_logica {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # ── Frontend Angular ─────────────────────────────────────────────────────
    root /var/www/baldrium-frontend/browser;
    index index.html;

    # Seguridad básica
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 10m;

    # ── API → logica ─────────────────────────────────────────────────────────
    # Sin barra final en proxy_pass: se conserva el prefijo /api, que es como
    # logica define sus rutas (app.use('/api/...')).
    location /api/ {
        proxy_pass http://baldrium_logica;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # La auditoría de logica lee la IP del cliente desde X-Forwarded-For
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;   # envío de correos puede tardar
    }

    # ── Archivos con hash (main-XXXX.js, styles-XXXX.css): caché larga ───────
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # ── index.html: nunca en caché (para que los usuarios reciban cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Rutas de Angular (/login, /inventario, ...) → index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
